<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #d1d5db;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            margin-top: 15px;
        }

        .search-area {
            display: flex;
            gap: 10px;
        }

        .search-btn {
            background: #374151;
            color: white;
        }

        .all-btn {
            background: #6b7280;
            color: white;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #1f2937;
            color: white;
            padding: 13px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f3f4f6;
        }

        .count {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #6b7280;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .search-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Student Record Management System</h1>
    <p>Manage student information easily</p>
</div>

<div class="container">

    <div class="card">
        <h2>Add Student</h2>

        <form id="studentForm">

            <div class="form-grid">

                <input type="text" id="name"
                       placeholder="Student Name" required>

                <input type="text" id="rollNo"
                       placeholder="Roll Number" required>

                <input type="text" id="branch"
                       placeholder="Branch" required>

                <input type="number" id="marks"
                       placeholder="Marks" required>

                <input type="text" id="phone"
                       placeholder="Phone Number">

            </div>

            <button class="add-btn" type="submit">
                + Add Student
            </button>

        </form>
    </div>


    <div class="card">

        <h2>Search Students</h2>

        <div class="search-area">

            <input type="text"
                   id="search"
                   placeholder="Search by name, roll number or branch">

            <button class="search-btn"
                    onclick="searchStudents()">
                Search
            </button>

            <button class="all-btn"
                    onclick="showAllStudents()">
                Show All
            </button>

        </div>

    </div>


    <div class="card">

        <div class="count">
            Total Students: <span id="totalStudents">0</span>
        </div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Branch</th>
                        <th>Marks</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable"></tbody>

            </table>

            <div class="empty" id="emptyMessage">
                No student records found.
            </div>

        </div>

    </div>

</div>


<script>

let students = JSON.parse(
    localStorage.getItem("studentRecords") || "[]"
);

function saveStudents() {
    localStorage.setItem(
        "studentRecords",
        JSON.stringify(students)
    );
}

function displayStudents(list = students) {

    const table = document.getElementById("studentTable");
    const emptyMessage = document.getElementById("emptyMessage");

    table.innerHTML = "";

    document.getElementById("totalStudents").textContent =
        list.length;

    if (list.length === 0) {
        emptyMessage.style.display = "block";
        return;
    }

    emptyMessage.style.display = "none";

    list.forEach(function(student, index) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHTML(student.name)}</td>
            <td>${escapeHTML(student.rollNo)}</td>
            <td>${escapeHTML(student.branch)}</td>
            <td>${escapeHTML(student.marks)}</td>
            <td>${escapeHTML(student.phone)}</td>
            <td>
                <button
                    class="delete-btn"
                    onclick="deleteStudent(${student.id})">
                    Delete
                </button>
            </td>
        `;

        table.appendChild(row);
    });
}

document.getElementById("studentForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const student = {

        id: Date.now(),

        name: document.getElementById("name").value.trim(),

        rollNo: document.getElementById("rollNo").value.trim(),

        branch: document.getElementById("branch").value.trim(),

        marks: document.getElementById("marks").value.trim(),

        phone: document.getElementById("phone").value.trim()

    };

    students.push(student);

    saveStudents();

    displayStudents();

    this.reset();
});


function deleteStudent(id) {

    if (confirm("Are you sure you want to delete this student?")) {

        students = students.filter(
            student => student.id !== id
        );

        saveStudents();

        displayStudents();
    }
}


function searchStudents() {

    const searchText =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    if (!searchText) {
        displayStudents();
        return;
    }

    const results = students.filter(function(student) {

        return (
            student.name.toLowerCase().includes(searchText) ||
            student.rollNo.toLowerCase().includes(searchText) ||
            student.branch.toLowerCase().includes(searchText)
        );

    });

    displayStudents(results);
}


function showAllStudents() {

    document.getElementById("search").value = "";

    displayStudents();
}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


displayStudents();

</script>

</body>
</html>
